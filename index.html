<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muscle Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1f4;--fg:#14202b;--mut:#5b6875;--card:#fff;--line:#cfd6dd;--ac:#b3263e;--acf:#fff;--ok:#d3eee1;--bad:#f8d9dd;--hl:#ffe9a8}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161d;--fg:#e6ebf0;--mut:#9aa6b2;--card:#182330;--line:#2b3947;--ac:#e0566d;--acf:#14202b;--ok:#17402f;--bad:#4a1f27;--hl:#5a4a12}}
:root[data-theme="dark"]{--bg:#0f161d;--fg:#e6ebf0;--mut:#9aa6b2;--card:#182330;--line:#2b3947;--ac:#e0566d;--acf:#14202b;--ok:#17402f;--bad:#4a1f27;--hl:#5a4a12}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:400 16px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font:600 28px/1.2 Newsreader,Georgia,serif;margin:4px 0 12px}
nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:12px}
nav button{background:none;border:0;padding:8px 12px;font:500 15px inherit;font-family:inherit;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button[aria-selected=true]{color:var(--fg);border-color:var(--ac)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;color:var(--mut);font-size:14px}
select,input[type=text],textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{width:100%;min-height:70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.q{font:500 15px inherit;color:var(--mut);margin:0 0 4px}
.name{font:600 30px/1.2 Newsreader,Georgia,serif;margin:0 0 4px}
.ans{font-size:18px;margin:14px 0;padding:12px;background:var(--bg);border-radius:8px}
button.b{font:500 15px inherit;font-family:inherit;padding:9px 16px;border-radius:6px;border:1px solid var(--ac);background:var(--ac);color:var(--acf);cursor:pointer;margin:4px 6px 0 0}
button.b.o{background:none;color:var(--fg);border-color:var(--line)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
.opt.ok,.chk.ok{background:var(--ok);border-color:#2a9d6f}.opt.bad,.chk.bad{background:var(--bad);border-color:var(--ac)}
.chk{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0}
.score{margin-left:auto;font-weight:600;color:var(--fg)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:820px;font-size:14px;background:var(--card)}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--bg)}
.pic{display:block;max-width:100%;max-height:340px;margin:12px auto 0;border-radius:8px}
.th{height:64px;border-radius:4px;display:block}
small{color:var(--mut)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
.empty{padding:24px;text-align:center;color:var(--mut)}
code{background:var(--bg);padding:1px 5px;border-radius:4px}
</style></head>
<body><main>
<h1>Muscle Trainer</h1>
<nav role="tablist" id="tabs"></nav>
<div class="bar" id="bar">
 <label>Section <select id="sec"></select></label>
 <label>Field <select id="fld"></select></label>
 <label><input type="checkbox" id="mo"> Missed only</label>
 <span class="score" id="score"></span>
</div>
<div id="view"></div>
</main>

{name:"Flexor digiti minimi brevis",img:"fdm",origin:"Base of 5th metatarsal; sheath of peroneus longus tendon",insertion:"Lateral sides of the base of 5th proximal phalanx",action:"Flexes proximal phalanx of 5th toe",nerve:"Lateral plantar nerve"},
{name:"Dorsal interossei",img:"di",origin:"Adjacent sides of metatarsal bones",insertion:"1st: medial side of proximal phalanx of 2nd toe; 2nd to 4th: lateral sides of proximal phalanges of toes 2-4",action:"Abduct toes; flex proximal phalanges",nerve:"Lateral plantar nerve"},
{name:"Plantar interossei",img:"pi",origin:"Medial aspect of metatarsals 3-5",insertion:"Proximal phalanges 3-5",action:"Adduct toes; flex proximal phalanges",nerve:"Lateral plantar nerve"}
]}];

const F={origin:"Origin",insertion:"Insertion",action:"Action",nerve:"Innervation"};
const MODES=[["flash","Flashcards"],["mc","Multiple choice"],["type","Type-in"],["id","Identify"],["pat","Patterns"],["exp","Explore"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const pic=m=>m.img&&IMG[m.img]?`<img class="pic" src="${IMG[m.img]}" alt="Slide photo of ${esc(m.name)}">`:"";
const norm=t=>t.replace(/\s*\([^)]*\)/g,"").trim();
const toks=s=>s.split(";").map(t=>t.trim()).filter(Boolean);
let mode="flash",missed=new Set(),sc={r:0,w:0},cur=null,rev=false;
try{missed=new Set(JSON.parse(localStorage.getItem("mm")||"[]"))}catch(e){}
function save(){try{localStorage.setItem("mm",JSON.stringify([...missed]))}catch(e){}}
const all=()=>DATA.flatMap(s=>s.muscles.map(m=>({...m,section:s.section})));
function pool(){const sec=$("#sec").value;let p=all().filter(m=>sec==="*"||m.section===sec);return p}
function qpool(){let p=pool();if($("#mo").checked)p=p.filter(m=>missed.has(m.name));return p}
function rec(ok){ok?(sc.r++,missed.delete(cur.m.name)):(sc.w++,missed.add(cur.m.name));save();score()}
function score(){$("#score").textContent=mode==="exp"?"":`${sc.r} right, ${sc.w} missed`+(missed.size?` (${missed.size} to review)`:"")}

function init(){
 $("#tabs").innerHTML=MODES.map(([k,l])=>`<button role="tab" data-m="${k}" aria-selected="${k===mode}">${l}</button>`).join("");
 $("#sec").innerHTML='<option value="*">All sections</option>'+DATA.map(s=>`<option>${esc(s.section)}</option>`).join("");
 $("#fld").innerHTML='<option value="*">All fields</option>'+Object.entries(F).map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
 $("#tabs").onclick=e=>{const k=e.target.dataset.m;if(k){mode=k;init2()}};
 ["sec","fld","mo"].forEach(i=>$("#"+i).onchange=next);
 init2();
}
function init2(){[...$("#tabs").children].forEach(b=>b.setAttribute("aria-selected",b.dataset.m===mode));
 $("#fld").parentElement.style.display=(mode==="pat"||mode==="exp"||mode==="id")?"none":"";
 $("#mo").parentElement.style.display=mode==="exp"?"none":"";next()}

function next(){
 rev=false;score();
 if(!all().length){$("#view").innerHTML='<div class="card empty">No muscles loaded yet. Upload a class section and it will be added here.</div>';return}
 if(mode==="exp")return explore();
 if(mode==="id")return ident();
 if(mode==="pat")return pattern();
 const p=qpool();
 if(!p.length){$("#view").innerHTML='<div class="card empty">Nothing to show with these filters. Clear "Missed only" or pick another section.</div>';return}
 const f=$("#fld").value==="*"?rnd(Object.keys(F)):$("#fld").value;
 cur={m:rnd(p),f};
 ({flash,mc,type})[mode]();
}
const head=()=>`<p class="q">${F[cur.f]} of</p><h2 class="name">${esc(cur.m.name)}</h2>`;
const grade=()=>`<button class="b" data-g="1">Got it</button><button class="b o" data-g="0">Missed it</button>`;
function bindGrade(){document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{rec(b.dataset.g==="1");next()})}

function flash(){
 const v=$("#view");
 v.innerHTML=`<div class="card">${head()}${rev?`<div class="ans">${esc(cur.m[cur.f])}</div>${pic(cur.m)}${grade()}`:'<button class="b" id="rv">Show answer</button>'}</div>`;
 if(rev)bindGrade();else $("#rv").onclick=()=>{rev=true;flash()};
}
function mc(){
 const right=cur.m[cur.f];
 const pool2=[...new Set(all().map(m=>m[cur.f]).filter(x=>x!==right))];
 const opts=shuf([right,...shuf(pool2).slice(0,3)]);
 $("#view").innerHTML=`<div class="card">${head()}<div id="o">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div><div id="nx"></div></div>`;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  const ok=opts[b.dataset.i]===right;
  document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(opts[x.dataset.i]===right)x.classList.add("ok")});
  if(!ok)b.classList.add("bad");
  rec(ok);$("#nx").innerHTML=pic(cur.m)+'<button class="b" id="n">Next</button>';$("#n").onclick=next});
 if(opts.length<2)$("#nx").innerHTML='<p class="q">Add more sections to get answer choices.</p>';
}
function type(){
 $("#view").innerHTML=`<div class="card">${head()}<textarea id="t" aria-label="Your answer" placeholder="Type what you remember"></textarea>${rev?"":'<button class="b" id="ck">Check</button>'}<div id="r"></div></div>`;
 if(rev)return;
 $("#ck").onclick=()=>{
  rev=true;const ans=cur.m[cur.f],words=[...new Set(ans.toLowerCase().match(/[a-z]{4,}/g)||[])],
  got=($("#t").value.toLowerCase().match(/[a-z]{4,}/g)||[]),hit=words.filter(w=>got.includes(w));
  $("#ck").remove();
  $("#r").innerHTML=`<div class="ans">${esc(ans)}</div>${pic(cur.m)}<p class="q">Key terms matched: ${hit.length} of ${words.length}. You decide if it counts.</p>${grade()}`;bindGrade()}
}
function ident(){
 const p=qpool().filter(m=>IMG[m.img]);
 if(!p.length){$("#view").innerHTML='<div class="card empty">No photos to quiz with these filters. Clear "Missed only" or pick another section.</div>';return}
 const m=rnd(p);cur={m,f:"name"};
 const oth=shuf(all().filter(x=>x.name!==m.name)).sort((a,b)=>(b.section===m.section)-(a.section===m.section)).slice(0,3);
 const opts=shuf([m.name,...oth.map(x=>x.name)]);
 $("#view").innerHTML=`<div class="card"><p class="q">Which muscle is shown in blue?</p>${pic(m)}<div id="o">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div><div id="nx"></div></div>`;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  const ok=opts[b.dataset.i]===m.name;
  document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(opts[x.dataset.i]===m.name)x.classList.add("ok")});
  if(!ok)b.classList.add("bad");
  rec(ok);$("#nx").innerHTML='<button class="b" id="n">Next</button>';$("#n").onclick=next});
}
function pattern(){
 const p=pool(),cnt={};
 ["nerve","action"].forEach(k=>p.forEach(m=>toks(m[k]).map(norm).forEach(t=>{(cnt[k+"|"+t]=cnt[k+"|"+t]||[]).push(m.name)})));
 const cands=Object.keys(cnt).filter(x=>cnt[x].length>=2);
 if(!cands.length){$("#view").innerHTML='<div class="card empty">Pattern questions need at least two muscles that share a nerve or action. Load more muscles or choose All sections.</div>';return}
 const key=rnd(cands),k=key.split("|")[0],t=key.slice(k.length+1),ans=new Set(cnt[key]),list=shuf(p.map(m=>m.name));
 $("#view").innerHTML=`<div class="card"><p class="q">${k==="nerve"?"Select every muscle innervated by":"Select every muscle whose action includes"}</p><h2 class="name">${esc(t)}</h2>
 <div id="l">${list.map((n,i)=>`<label class="chk"><input type="checkbox" value="${i}"> ${esc(n)}</label>`).join("")}</div>
 <button class="b" id="ck">Check</button><div id="r"></div></div>`;
 $("#ck").onclick=()=>{
  let ok=true;
  document.querySelectorAll(".chk").forEach(l=>{const inp=l.querySelector("input"),n=list[inp.value],sel=inp.checked,c=ans.has(n);
   inp.disabled=true;if(c)l.classList.add("ok");else if(sel)l.classList.add("bad");if(sel!==c)ok=false});
  ok?sc.r++:sc.w++;score();
  $("#ck").outerHTML='<button class="b" id="n">Next</button>';$("#n").onclick=next;
  $("#r").innerHTML=`<p class="q">${ok?"All correct.":"Green rows are the muscles that share this."}</p>`}
}
function explore(){
 const p=pool(),nerves=[...new Set(p.flatMap(m=>toks(m.nerve).map(norm)))].sort();
 $("#view").innerHTML=`<div class="bar"><label>Nerve <select id="en"><option value="">Any</option>${nerves.map(n=>`<option>${esc(n)}</option>`).join("")}</select></label>
 <label>Search <input type="text" id="es" placeholder="e.g. scapula, abduct"></label>
 <label>Sort <select id="eo"><option value="">Class order</option><option value="nerve">Innervation</option><option value="action">Action</option></select></label></div>
 <p class="q">Highlighted text appears in more than one row. Sort by innervation to see groups together.</p><div class="wrap" id="tb"></div>`;
 const draw=()=>{
  const n=$("#en").value,s=$("#es").value.toLowerCase(),o=$("#eo").value;
  let rows=p.filter(m=>(!n||toks(m.nerve).map(norm).includes(n))&&(!s||Object.keys(F).concat("name").some(k=>m[k].toLowerCase().includes(s))));
  if(o)rows=[...rows].sort((a,b)=>a[o].localeCompare(b[o]));
  const cnt={};Object.keys(F).forEach(k=>{cnt[k]={};rows.forEach(m=>toks(m[k]).forEach(t=>cnt[k][norm(t)]=(cnt[k][norm(t)]||0)+1))});
  const cell=(m,k)=>toks(m[k]).map(t=>cnt[k][norm(t)]>1?`<mark>${esc(t)}</mark>`:esc(t)).join("; ");
  $("#tb").innerHTML=rows.length?`<table><thead><tr><th>Muscle</th><th>Photo</th>${Object.values(F).map(l=>`<th>${l}</th>`).join("")}</tr></thead><tbody>${rows.map(m=>`<tr><td><b>${esc(m.name)}</b><br><small>${esc(m.section)}</small></td><td>${m.img&&IMG[m.img]?`<img class="th" src="${IMG[m.img]}" alt="">`:""}</td>${Object.keys(F).map(k=>`<td>${cell(m,k)}</td>`).join("")}</tr>`).join("")}</tbody></table>`:'<div class="empty">No muscles match.</div>';
 };
 ["en","es","eo"].forEach(i=>$("#"+i).oninput=draw);draw();
}
init();
</script></body></html>
